name: Upstream sync

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge michael-denyer/pstack-claude main into main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UPSTREAM_REPOSITORY: michael-denyer/pstack-claude
      UPSTREAM_BRANCH: main
    steps:
      - name: Require the sync token
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Add the UPSTREAM_SYNC_TOKEN secret: a fine-grained token on ${GITHUB_REPOSITORY} with Contents, Workflows, and Pull requests write. The default token cannot push upstream commits that change .github/workflows."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet "https://github.com/${UPSTREAM_REPOSITORY}.git" "${UPSTREAM_BRANCH}"
          upstream_sha=$(git rev-parse --short FETCH_HEAD)
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "main already contains ${UPSTREAM_REPOSITORY}@${upstream_sha}"
            echo "outcome=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="Merge ${UPSTREAM_REPOSITORY}@${upstream_sha} into main"
          if git merge --no-edit -m "$message" FETCH_HEAD; then
            echo "outcome=clean" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit --quiet --no-verify -m "$message (conflicts)"
            echo "outcome=conflict" >> "$GITHUB_OUTPUT"
          fi
      - name: Push a clean merge to main, or open a pull request for the conflicts
        if: steps.merge.outputs.outcome != 'current'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          OUTCOME: ${{ steps.merge.outputs.outcome }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          push_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "$OUTCOME" = "clean" ]; then
            git push "$push_remote" HEAD:main
            exit 0
          fi
          branch="upstream-sync/${UPSTREAM_SHA}"
          git push --force "$push_remote" "HEAD:refs/heads/${branch}"
          if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Merge ${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA} into main" \
              --body "The nightly merge of ${UPSTREAM_REPOSITORY} main hit conflicts. This branch commits the conflict markers. Resolve them here, then merge."
          fi
