name: Upstream sync

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync pstack to the newest upstream release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Read the pinned and newest upstream versions
        id: versions
        run: |
          remote=$(jq -r .remote tools/upstream.json)
          pinned_sha=$(jq -r .components.pstack.sha tools/upstream.json)
          git clone --quiet --filter=blob:none --no-checkout "$remote" "$RUNNER_TEMP/upstream"
          newest_sha=$(git -C "$RUNNER_TEMP/upstream" log -1 --format=%h origin/HEAD -- pstack)
          pinned_version=$(git -C "$RUNNER_TEMP/upstream" show "$pinned_sha:pstack/.cursor-plugin/plugin.json" | jq -r .version)
          newest_version=$(git -C "$RUNNER_TEMP/upstream" show "$newest_sha:pstack/.cursor-plugin/plugin.json" | jq -r .version)
          echo "Pinned upstream $pinned_version at $pinned_sha, newest $newest_version at $newest_sha"
          {
            echo "newest_sha=$newest_sha"
            echo "pinned_sha=$pinned_sha"
            echo "newest_version=$newest_version"
            echo "changed=$([ "$pinned_version" != "$newest_version" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - name: Sync, regenerate, and test
        id: sync
        if: steps.versions.outputs.changed == 'true'
        env:
          NEWEST_SHA: ${{ steps.versions.outputs.newest_sha }}
          PINNED_SHA: ${{ steps.versions.outputs.pinned_sha }}
          NEWEST_VERSION: ${{ steps.versions.outputs.newest_version }}
        run: |
          set -o pipefail
          bun tools/sync.mjs pstack "$NEWEST_SHA" | tee "$RUNNER_TEMP/sync-report.txt"
          IFS=. read -r major minor patch < VERSION
          port_version="$major.$minor.$((patch + 1))"
          echo "$port_version" > VERSION
          summary=$(grep -E '^(updated|added|merged|deleted|conflicted|unchanged|dry run)' "$RUNNER_TEMP/sync-report.txt" | sed 's/^/- /')
          entry=$(printf '## %s - sync to upstream %s (v%s)\n\nThe upstream pin moves from `%s` to `%s`, upstream v%s. The nightly upstream sync workflow produced this entry from `bun tools/sync.mjs pstack %s`:\n\n%s\n' \
            "$port_version" "$NEWEST_SHA" "$NEWEST_VERSION" "$PINNED_SHA" "$NEWEST_SHA" "$NEWEST_VERSION" "$NEWEST_SHA" "$summary")
          ENTRY="$entry" bun -e '
            const fs = require("node:fs");
            const text = fs.readFileSync("CHANGES.md", "utf8");
            const at = text.indexOf("\n## ");
            fs.writeFileSync("CHANGES.md", text.slice(0, at + 1) + process.env.ENTRY + "\n" + text.slice(at + 1));
          '
          echo "port_version=$port_version" >> "$GITHUB_OUTPUT"
          if bun tools/generate.mjs && bun install --frozen-lockfile && bun test tests/; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish a clean sync to main, or open a pull request for review
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN: ${{ steps.sync.outputs.clean }}
          PORT_VERSION: ${{ steps.sync.outputs.port_version }}
          NEWEST_SHA: ${{ steps.versions.outputs.newest_sha }}
          NEWEST_VERSION: ${{ steps.versions.outputs.newest_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          message="Sync to upstream $NEWEST_SHA (v$NEWEST_VERSION) ($PORT_VERSION)"
          if [ "$CLEAN" = "true" ]; then
            git add -A
            git commit --quiet -m "$message"
            git push origin HEAD:main
            exit 0
          fi
          branch="upstream-sync/$NEWEST_SHA"
          git checkout -b "$branch"
          git add -A
          git commit --quiet -m "$message"
          git push --force origin "$branch"
          gh pr create --head "$branch" --title "$message" \
            --body "The sync to upstream v$NEWEST_VERSION left conflict markers or failing tests. Resolve them on this branch, then merge. The workflow run log holds the sync report."
