name: Upstream sync

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to sync
        default: main

permissions: {}

concurrency:
  group: upstream-sync-${{ inputs.target_branch || 'main' }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the branch to michael-denyer/pstack-claude main
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the sync commit to the target branch
    env:
      UPSTREAM_REPOSITORY: michael-denyer/pstack-claude
      UPSTREAM_BRANCH: main
      FORK_OWNED_PATH: .github/workflows
      TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build upstream's tree with this fork's workflows
        id: build
        run: |
          git fetch --quiet --depth=1 "https://github.com/${UPSTREAM_REPOSITORY}.git" "${UPSTREAM_BRANCH}"
          upstream_sha=$(git rev-parse FETCH_HEAD)
          export GIT_INDEX_FILE="$RUNNER_TEMP/sync-index"
          git read-tree FETCH_HEAD
          git ls-files -z -- "$FORK_OWNED_PATH" | xargs -0 -r git update-index --force-remove --
          git ls-tree -r HEAD -- "$FORK_OWNED_PATH" | git update-index --index-info
          tree=$(git write-tree)
          if [ "$tree" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "${TARGET_BRANCH} already matches ${UPSTREAM_REPOSITORY}@${upstream_sha}"
            exit 0
          fi
          commit=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" -p HEAD \
            -m "Sync to ${UPSTREAM_REPOSITORY}@${upstream_sha:0:7}" \
            -m "Upstream-Commit: ${upstream_sha}")
          git diff --quiet FETCH_HEAD "$commit" -- . ":(exclude)${FORK_OWNED_PATH}"
          git diff --quiet HEAD "$commit" -- "$FORK_OWNED_PATH"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Push the sync commit
        if: steps.build.outputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${COMMIT}:refs/heads/${TARGET_BRANCH}"
          git log --oneline -1 "$COMMIT"
